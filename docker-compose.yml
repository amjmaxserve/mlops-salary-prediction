version: '3.9'

services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi

    container_name: fastapi_ml_app

    ports:
      - "8000:8000"

        #    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: streamlit_ui

    ports:
      - "8501:8501"

    depends_on:
      - fastapi

    restart: unless-stopped
